function locLabel(loc) {
  if (loc.includes('好奇')) return {text:'辦・好奇', cls:'loc-好奇'};
  if (loc.includes('熱情')) return {text:'辦・熱情/樂觀', cls:'loc-熱情'};
  if (loc.includes('實習')) return {text:'辦・實習區', cls:'loc-實習'};
  return {text:'倉庫', cls:'loc-倉庫'};
}

function freqLabel(f) {
  if (f==='高') return {text:'每週用', cls:'freq-高'};
  if (f==='中') return {text:'每月用', cls:'freq-中'};
  return {text:'低頻', cls:'freq-低'};
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  let filtered = items.filter(i => {
    const matchQ = !q || i.name.toLowerCase().includes(q) || i.note.toLowerCase().includes(q);
    const matchF = currentFilter === 'all' || 
      (currentFilter === '倉' ? i.loc.startsWith('倉') : i.loc === currentFilter);
    return matchQ && matchF;
  });

  const cnt = document.getElementById('count');
  cnt.textContent = filtered.length > 0 ? `找到 ${filtered.length} 件物品` : '';

  const res = document.getElementById('results');
  if (filtered.length === 0) {
    res.innerHTML = '<div class="empty">找不到符合的物品</div>';
    return;
  }

  res.innerHTML = filtered.map(i => {
    const loc = locLabel(i.loc);
    const freq = freqLabel(i.freq);
    return `<div class="item-card">
      <span class="loc-badge ${loc.cls}">${loc.text}</span>
      <span class="item-name">${i.name}</span>
      <span class="freq-badge ${freq.cls}">${freq.text}</span>
      <span class="item-meta">${i.qty}</span>
      ${i.note ? `<span class="item-note" title="${i.note}">${i.note}</span>` : ''}
    </div>`;
  }).join('');
}

render();
</script>
